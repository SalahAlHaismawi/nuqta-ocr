name: NuqtaOCR
options:
  bundleIdPrefix: ai.nuqta
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  NuqtaOCR:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
        excludes: ["Resources/**"]
      - path: Core
      - path: ../core/nuqta_core.cpp
      - path: ../core/nuqta_core.h
      - path: App/Resources/samples
        buildPhase: resources
      - path: App/Resources/fonts
        buildPhase: resources
    dependencies:
      - framework: ../vendor/llama.cpp/build-apple/llama.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        PRODUCT_NAME: Nuqta OCR
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Core/NuqtaOCR-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../core
          - $(SRCROOT)/../vendor/llama.cpp/include
          - $(SRCROOT)/../vendor/llama.cpp/ggml/include
          - $(SRCROOT)/../vendor/llama.cpp/tools/mtmd
        GCC_OPTIMIZATION_LEVEL: s
        ENABLE_BITCODE: NO
    info:
      path: App/Info.plist
      properties:
        UIAppFonts: [noto_naskh.ttf, source_serif.ttf, plex_sans.ttf]
        UILaunchScreen: {}
        NSCameraUsageDescription: Take a photo of a page to read it on this iPhone.
        CFBundleDisplayName: Nuqta OCR
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
